name: Build OpenPVP resource pack

on:
  push:
    branches: [main]
    paths:
      - build_resourcepack.py
      - .github/workflows/build-resourcepack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build resource pack
        run: python build_resourcepack.py

      - name: Commit generated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenPVPCountryFlags-resourcepack-1.21.11.zip SHA1.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build OpenPVP resource pack"
          git push
